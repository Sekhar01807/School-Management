name: SchoolSync CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Backend Verification & Test Matrix
  # ==========================================
  backend-test:
    name: Backend CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate TypeScript Types
        run: npm run build

      - name: Run Automated Test Suites
        run: npm test
        env:
          JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long!
          MONGO_URL: mongodb://localhost:27017/schoolsync_test
          NODE_ENV: test

  # ==========================================
  # Frontend Verification & Build
  # ==========================================
  frontend-build:
    name: Frontend CI & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run ESLint
        run: npm run lint || true

      - name: Build Production Vite Bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.schoolsync.com/api
