services:
  # ==========================================
  # SchoolSync Backend API (Web Service)
  # ==========================================
  - type: web
    name: schoolsync-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: STAGE
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: COOKIE_SAME_SITE
        value: none
      - key: GOOGLE_GENERATIVE_AI_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: '"SchoolSync Notifications" <notifications@schoolsync.com>'
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_SECURE
        value: false
      - key: RESEND_API_KEY
        sync: false
      - key: SEED_DEFAULT_DATA
        value: "false"

  # ==========================================
  # SchoolSync Frontend Web Application (Static Site)
  # ==========================================
  - type: web
    name: schoolsync-web
    runtime: static
    plan: starter
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
