<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="schoolSyncGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E40AF" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#schoolSyncGrad)" />

  <!-- Inner Subtle Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="8" />

  <!-- SchoolSync Iconic School Emblem (Crisp White Vector) -->
  <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" transform="translate(106, 106)">
    <!-- Roof / Gable -->
    <path d="M 150 20 L 270 90 L 30 90 Z" fill="#FFFFFF" fill-opacity="0.15" />
    <path d="M 150 20 L 270 90 L 30 90 Z" />
    
    <!-- Building Structure -->
    <path d="M 50 90 L 50 260 L 250 260 L 250 90" />
    
    <!-- Main Entrance Door -->
    <path d="M 120 260 L 120 180 Q 120 160 150 160 Q 180 160 180 180 L 180 260" fill="#FFFFFF" fill-opacity="0.2" />
    <path d="M 120 260 L 120 180 Q 120 160 150 160 Q 180 160 180 180 L 180 260" />
    
    <!-- Left Windows -->
    <rect x="75" y="115" width="30" height="35" rx="6" fill="#FFFFFF" />
    <rect x="75" y="180" width="30" height="35" rx="6" fill="#FFFFFF" />
    
    <!-- Right Windows -->
    <rect x="195" y="115" width="30" height="35" rx="6" fill="#FFFFFF" />
    <rect x="195" y="180" width="30" height="35" rx="6" fill="#FFFFFF" />
    
    <!-- Flag atop the School Roof -->
    <path d="M 150 20 L 150 -15" />
    <path d="M 150 -15 L 185 -5 L 150 5 Z" fill="#60A5FA" stroke="#60A5FA" stroke-width="4" />
  </g>
</svg>
